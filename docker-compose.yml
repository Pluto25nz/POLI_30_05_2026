services:
 
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - mysql
 
  mysql:
    image: mysql:8.0
    container_name: asena_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: asena_actas
    ports:
      - "3307:3306"
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: asena_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql